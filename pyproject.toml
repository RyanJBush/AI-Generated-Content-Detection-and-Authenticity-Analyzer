[project]
name = "litmus"
version = "0.1.0"
description = "AI-Text Likelihood + Slop-Pattern Analyzer"
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "scipy",
    "gradio",
]

[project.scripts]
litmus = "litmus.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: downloads tokenizers or models from the HF Hub; local only, excluded by default"]
addopts = "-m 'not slow'"
