[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "litmus"
dynamic = ["version"]
description = "Offline evidence-reporting tool for AI-generation signals (R0 skeleton)"
requires-python = ">=3.13"
dependencies = [
    "pillow==13.0.0",
    "c2pa-python==0.38.0",
]

[project.optional-dependencies]
# Model stack (R1-A); torch comes from the cu124 index, see requirements.lock
models = [
    "torch==2.6.0",
    "transformers==4.57.6",
]

[project.scripts]
litmus = "litmus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# R1-C: lexicons ship inside the package, loaded via importlib.resources
[tool.setuptools.package-data]
"litmus.quality" = ["lexicons/*.txt"]
"litmus.c2pa" = ["trust/*.pem"]

[tool.setuptools.dynamic]
version = { attr = "litmus.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
# Model-dependent tests need models/ (scripts/download_models.py) and CUDA;
# run them with: pytest -m slow
markers = ["slow: needs downloaded models and/or CUDA; excluded by default"]
addopts = '-m "not slow"'

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
