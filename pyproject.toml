[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "litmus"
dynamic = ["version"]
description = "Offline evidence-reporting tool for AI-generation signals (R0 skeleton)"
requires-python = ">=3.13"
dependencies = [
    "pillow==13.0.0",
    "c2pa-python==0.38.0",
]

[project.optional-dependencies]
# Model stack (R1-A); torch comes from the cu124 index, see requirements.lock
models = [
    "torch==2.6.0",
    "transformers==4.57.6",
]

[project.scripts]
litmus = "litmus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "litmus.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
